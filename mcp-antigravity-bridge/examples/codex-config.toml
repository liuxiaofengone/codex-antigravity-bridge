# Modified by liuxiaofengone, 2026-10-08: portable interpreter placeholder and tool timeout.
# Codex MCP configuration template. Copy only this server section into your config.
# Replace the sample command with the absolute path to the Python used for installation.
# Windows accepts forward slashes, avoiding TOML backslash escaping.
# The setup command registers the real interpreter path automatically.

[mcp_servers.codex-agy-bridge]
command = "C:/path/to/project/.venv/Scripts/python.exe"
args = ["-m", "codex_agy_bridge"]
startup_timeout_sec = 120
tool_timeout_sec = 1200

# Proxy and CLI paths are per-user. Omit this section if it is unnecessary.
# Replace PORT with your proxy port; never include usernames or passwords.
# [mcp_servers.codex-agy-bridge.env]
# HTTP_PROXY = "http://127.0.0.1:PORT"
# HTTPS_PROXY = "http://127.0.0.1:PORT"
# ALL_PROXY = "http://127.0.0.1:PORT"
# NO_PROXY = "localhost,127.0.0.1"
# AGY_PATH = "C:/path/to/agy.exe"
